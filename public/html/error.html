<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verification Failed</title>
  <link rel="icon" href="../img/logo.svg">
  <style>
    body {
      background: #fef2f2;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      color: #7f1d1d;
    }
    .container {
      background: #ffffff;
      border-radius: 12px;
      padding: 40px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #dc2626;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      text-decoration: none;
      color: white;
      background: #dc2626;
      border-radius: 8px;
      transition: 0.3s;
    }
    a:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>❌ Verification Failed</h1>
  <p>Invalid or expired link. Please request a new verification email.</p>
</div>
</body>
</html>

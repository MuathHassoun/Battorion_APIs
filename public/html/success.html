<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Verified</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    body {
      background: #f0fdf4;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      color: #065f46;
    }
    .container {
      background: #ffffff;
      border-radius: 12px;
      padding: 40px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #10b981;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      text-decoration: none;
      color: white;
      background: #10b981;
      border-radius: 8px;
      transition: 0.3s;
    }
    a:hover {
      background: #059669;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>✅ Email Verified Successfully!</h1>
  <p>Your email has been verified. You can now continue to use our services.</p>
</div>
</body>
</html>

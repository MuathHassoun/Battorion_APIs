<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battorion | Email Verification</title>
  <link rel="stylesheet" href="css/style.css">

  <meta name="description" content="Email verification page">
  <meta name="theme-color" content="#6c5ce7">
  <link rel="icon" href="../icon.png" />
  <link rel="apple-touch-icon" href="../icon.png" />
  <link rel="manifest" href="../site.webmanifest">
</head>
<body>
  <div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Gmail_Icon.png" alt="Gmail Icon" class="gmail-icon">
    <div class="spinner"></div>

    <h1>Verify Your Email</h1>
    <h3 id="email_address"></h3>
    <br>
    <p>
      We've sent a verification link to your email address.<br>
      Please check your Gmail inbox and click the link to continue.
    </p>
    <p>
      Note: It may take a few minutes for the email to arrive.
    </p>

    <section id="actions">
      <a href="https://mail.google.com" target="_blank" class="btn">
        Open Gmail
      </a>
      <button onclick="resendEmail()" class="btn">
        Resend Email
      </button>
    </section>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');
    const emailHeading = document.querySelector('h3');
    if (email) {
      emailHeading.textContent = `Email: ${email}`;
    } else {
      emailHeading.textContent = "No email provided.";
    }
  </script>
  <script src="js/app.js"></script>
  <script src="js/actions.js"></script>
</body>
</html>

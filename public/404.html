<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="./img/logo.svg" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .error-container {
      background: #fff;
      color: #333;
      padding: 40px 30px;
      border-radius: 20px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      animation: fadeIn 0.8s ease-in-out;
    }

    h1 {
      font-size: 3rem;
      color: #6c5ce7;
      margin-bottom: 15px;
    }

    p {
      font-size: 1rem;
      color: #555;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 10px;
      background: #6c5ce7;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    a:hover {
      background: #4e3dbd;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(108,92,231,0.35);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<section class="error-container">
  <h1>404</h1>
  <p>Sorry, the page you are looking for does not exist or may have been moved.</p>
  <a href="https://battorion-website.vercel.app/">Go Back Home</a>
</section>
</body>
</html>
